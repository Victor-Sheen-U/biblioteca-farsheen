spring.application.name=biblioteca-virtual-api
server.servlet.context-path=/biblioteca
spring.profiles.active=dev
spring.jpa.open-in-view=true

# OpenAPI (común a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# JWT (cambiar el secreto en producción mediante la variable JWT_SECRET; mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:biblioteca-farsheen-clave-secreta-de-desarrollo-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Administrador inicial (se crea al arrancar si no existe)
app.admin.documento=${ADMIN_DOCUMENTO:0000000000}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.correo=${ADMIN_CORREO:admin@biblioteca.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345*}