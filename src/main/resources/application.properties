spring.application.name=biblioteca-virtual-api
server.servlet.context-path=/biblioteca
spring.profiles.default=dev
spring.jpa.open-in-view=true

# OpenAPI (desactivado en perfil prod)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# JWT (obligatorio por variable de entorno en prod; mínimo 32 bytes)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Administrador inicial (se crea al arrancar si no existe; contraseña obligatoria en prod)
app.admin.documento=${ADMIN_DOCUMENTO:0000000000}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.correo=${ADMIN_CORREO:admin@biblioteca.com}

# Datos de demostración opcionales (nunca activos por defecto)
app.seed.demo-data=${SEED_DEMO_DATA:false}
