server.port=${PORT:10101}

# Base de datos obligatoria por variables de entorno en producción
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Errores y documentación cerrados en producción
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Secretos y CORS obligatorios por variables de entorno (sin defaults)
app.jwt.secret=${JWT_SECRET}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.seed.demo-data=false
