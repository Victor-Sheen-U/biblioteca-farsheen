server.port=10101
spring.datasource.url=jdbc:h2:mem:biblioteca_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Valores exclusivos para el entorno de pruebas automatizadas H2
app.jwt.secret=${JWT_SECRET:biblioteca-farsheen-clave-secreta-de-pruebas-256-bits}
app.admin.password=${ADMIN_PASSWORD:Admin12345*}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
